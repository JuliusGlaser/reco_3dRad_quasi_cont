# general parameters

path: /path/to/data
file: data_filename.dat

# What format to save reconstructed data (multiple possible, nii and mat not tested)
save_h5: True
save_mat: False
save_nii: False

# Sliding window parameters
slidingwindowpros: 4000  # number of projections to use for each reconstruction (depends on anatomy and resolution)
slidingwindowstep: 1000  # step size for sliding window  (how many spokes get replaced from one window to the next)
shift: [0] # [ppm] Image datasets can be reconstructed to account for different off-resonances, thereby optimizing the quality of the fat image, as chemical shift produces isotropic blurring in radial trajectories
steps: 0      # number of mean TEs to reconstruct, if 0, it will reconstruct all

coil_estimation_3d: True # only relevant if multichannel_combination is set to 4  
coil_compression: True # reduce coils to speed up reconstruction
N_virtual_coils: 14 # number of virtual coils to reduce to if coil_compression is set to True

undersampling_factor: 1 # retrospective undersampling factor

save_all_slices: False  # if True, it will save all reconstructed slices, if False, it will only save a certain number of slices around the center of the volume (see next parameter)
slices_around_center_to_save: 40
Fixed_output_slice: -1  # -1= None

iterativeReco: False # whether to do iterative reconstruction after the initial reconstruction
recon_type: basic #basic, model_based, k_s_sepa
custom_out_name: out_name
save_complete: True


recon_parameter:
  multichannel_combination: 4   # type of channel combination: 1 = ADC, 2 = RSS, 3 = adaptive coil combine Walsh, 4 = use sensitivity maps ESPIRIT 
  filter_type: 1                # type of filter: 0 = no filter, 1 = Hamming, 2 = Hanning, 3 = Gaussian
  filter_sigma: 6e-3            # only relevant if filter_type is set to Gaussian, it is the sigma of the Gaussian filter in k-space (in 1/units of FOV)

  translation_adjustment_vol: false # use translation of adjustment volume
  # translation_cor: 3
  # translation_sag: 0
  translation_cor: 0
  translation_sag: -1
  translation_tra: 0
  
  FOV: 200
  kvecMethod: 2           # 1= theoretical, 2 = measured k-vector
  #if kvecMethod == 2, specify where the file is
  kvecFile: GTT_1000mum.mat

  gridOS: 2
  kbWidth: 4
  b0correction: 2

iter_reco_parameter:
  gpu_exclusive_reco: True
  initial_sol_filt: False
  initial_sol_iterative: False
  slices_around_center: 100    #only relevant for LLR
  iters_to_save_step: 4

  reg: LLR
  solver: ADMM
  lambda: 0.0001
  rho: 0.05
  max_iter_ADMM: 25
  max_iter_CG: 45
  blk_size: [1,6,6]            #only relevant for LLR
  blk_stride: [1,2,2]           #only relevant for LLR
  randshift: True
  use_con_mask: False
  con_step: 0         #only relevant for contrast constrained reconstruction
  con_stride: 6          #only relevant for contrast constrained reconstruction

  
moba_parameter:

  init_file_path: /path/to/ini.h5
  init_fieldmap: True
  trafo_MGRE: sobolev
  scaling: 1.0e-5
  alpha: 1.0
  redu: 1.5
  inner_tol: 0.01
  max_iter_IRGNM: 10
  max_iter_CG: 60
